[project]
name = "recruitagent-ai-backend"
version = "0.1.0"
description = "Human-in-the-loop AI recruiting operations agent — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "openai>=1.60",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Seed data is content (long resume/evidence strings), not code style.
"app/seed/demo_data.py" = ["E501"]
