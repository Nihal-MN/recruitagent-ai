# RecruitAgent AI — full local stack
#
#   docker compose up --build -d
#   docker compose exec api uv run python -m app.seed    # one-time demo data
#   open http://localhost:3000
#
# Ports are configurable via a .env file (see .env.example) so the stack can
# coexist with other local projects.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruitagent
      POSTGRES_PASSWORD: recruitagent
      POSTGRES_DB: recruitagent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitagent -d recruitagent"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recruitagent:recruitagent@db:5432/recruitagent
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-3000}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${API_PORT:-8000}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
