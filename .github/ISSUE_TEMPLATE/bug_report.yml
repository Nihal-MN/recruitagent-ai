name: Bug report
description: Something behaves differently than documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Two quick notes first:

        - **Questions and "how do I…"** go to [Discussions](https://github.com/Nihal-MN/recruitagent-ai/discussions) → Q&A, not here.
        - If the agent *proposed* something instead of doing it — that's the product working as designed (see the Approvals page). A bug is when it does something it shouldn't, or proposes something wrong.
        - Never paste real candidate data, resume text or secrets into an issue. Synthetic examples only.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact message you sent the agent, if applicable.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build -d
        2. docker compose exec api python -m app.seed
        3. In Agent Chat, send: "..."
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which AI provider was active?
      description: The sidebar badge or /health page shows this.
      options:
        - demo (deterministic, no API key)
        - openai (live tool calling)
        - not sure
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: How are you running it?
      options:
        - Docker Compose (the documented way)
        - Local dev (uv + npm)
        - Something else
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Relevant Tool Trace / Activity entries (optional)
      description: The Tool Trace and Activity pages show what actually ran — usually the fastest way to see what went wrong.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have not pasted real candidate data or secrets.
          required: true
        - label: This is not a question about how to use the project (those belong in Discussions).
          required: true
